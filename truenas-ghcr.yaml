# Public GHCR image: ghcr.io/hloiseau/torrent-watch:0.2.4
# Replace 192.168.1.10 with your NAS LAN IP and 8080 with the qBittorrent WebUI port.
services:
  torrent-watch:
    image: ghcr.io/hloiseau/torrent-watch:0.2.4
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_ORIGIN: https://suivi.hugoloiseau.fr
      PLEX_SERVER_ID: CHANGE_ME_PLEX_MACHINE_IDENTIFIER
      QBIT_URL: http://192.168.1.10:8080
      QBIT_USERNAME: admin
      QBIT_PASSWORD: CHANGE_ME_QBIT_PASSWORD
      # Exact category allowlist. Omit to show all torrents.
      # QBIT_CATEGORIES: '["radarr","sonarr"]'
    ports:
      - "192.168.1.10:5080:5080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
