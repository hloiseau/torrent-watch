# Build the local image first (README), then use Apps > Install via YAML.
# Replace the example LAN IP and credentials.
services:
  torrent-watch:
    image: torrent-watch:0.2.1
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_ORIGIN: https://suivi.hugoloiseau.fr
      PLEX_SERVER_ID: CHANGE_ME_PLEX_MACHINE_IDENTIFIER
      QBIT_URL: http://192.168.1.10:8080
      QBIT_USERNAME: admin
      QBIT_PASSWORD: CHANGE_ME_QBIT_PASSWORD
      # Uncomment to only share these categories; names must match exactly.
      # QBIT_CATEGORIES: '["radarr","sonarr"]'
    ports:
      - "192.168.1.10:5080:5080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
